<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ベビーグッズ神経衰弱｜ジェンダーリビール ゲーム</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://webkuuta.com/play/memory/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--cocoa:#6b4f5a;--soft:#8c727c;--pink:#f6a9c6;--pink-deep:#e57fa6;--blue:#9ccdf3;--blue-deep:#5a9fd8;--gold:#ffd66b;--f-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--f-latin:"Fredoka","Zen Maru Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(180deg,#fffaf6,#fdf2f4 60%,#f3eef8);color:var(--cocoa);font-family:var(--f-round);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center}
.hud{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;width:100%}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:900;box-shadow:0 3px 10px rgba(107,79,90,.1)}
.eb{margin:8px 0 0;font-family:var(--f-latin);font-weight:600;font-size:11px;letter-spacing:.3em;color:#b98f3f}
h1{margin:2px 0 0;font-weight:900;font-size:24px;line-height:1.3}
p{margin:4px 0 0;font-size:13px;color:var(--soft);line-height:1.6}
.levels{display:flex;gap:8px;justify-content:center;margin-top:10px}
.levels button{border:2px solid transparent;border-radius:999px;padding:8px 14px;font:inherit;font-weight:900;font-size:13px;background:#fff;color:var(--cocoa);box-shadow:0 4px 12px rgba(180,140,170,.14)}
.levels button[aria-pressed="true"]{border-color:var(--pink-deep);background:#ffeef5}
.board{display:grid;gap:8px;width:100%;max-width:420px;margin-top:12px;flex:1;align-content:center}
.cardb{position:relative;aspect-ratio:3/4;border:0;background:none;padding:0;perspective:600px;cursor:pointer}
.cardb .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.cardb.open .in,.cardb.done .in{transform:rotateY(180deg)}
.cardb .f,.cardb .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(180,140,170,.16)}
.cardb .b{background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;font-family:var(--f-latin);font-weight:700;font-size:20px}
.cardb .b::after{content:"?";}
.cardb .f{background:#fff;transform:rotateY(180deg);font-size:clamp(26px,9vw,44px)}
.cardb.done .f{background:#eefaf2;box-shadow:0 0 0 3px #7cc8a0 inset}
.cardb.done{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.08)}}
.btn{border:0;border-radius:999px;padding:13px 32px;font:inherit;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(100deg,var(--pink-deep),#f1a2bf 50%,var(--blue-deep));box-shadow:0 10px 24px rgba(214,160,190,.4);margin-top:10px}
.btn.l{background:#fff;color:var(--cocoa);box-shadow:0 6px 16px rgba(180,140,170,.18);font-size:14px;padding:10px 20px}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:8px;background:rgba(255,250,246,.92);z-index:3}
.ov[hidden]{display:none}
.big{font-family:var(--f-latin);font-weight:700;font-size:50px;line-height:1;color:var(--pink-deep);text-shadow:0 4px 0 #fff}
.card{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 6px 18px rgba(180,140,170,.14);font-size:13px;text-align:left;min-width:240px}
.card .r{display:flex;justify-content:space-between;gap:12px}.card .r em{font-style:normal;font-weight:900}
.stars{font-size:34px;color:#e3d2c3;text-shadow:0 3px 0 #fff}.stars b{color:#f0b429;font-weight:400}
</style>
</head>
<body>
<div class="hud"><span class="pill" id="hTime">⏱ 0.0</span><span class="pill" id="hMoves">🔁 0回</span><span class="pill" id="hPairs">✓ 0/6</span></div>
<p class="eb">GENDER REVEAL MINI GAME</p>
<h1>ベビーグッズ神経衰弱</h1>
<p>同じベビーグッズのペアをそろえよう。はやく・少ない回数で！</p>
<div class="levels" id="levels"><button type="button" data-l="0" aria-pressed="true">やさしい 3×4</button><button type="button" data-l="1" aria-pressed="false">ふつう 4×4</button><button type="button" data-l="2" aria-pressed="false">むずかしい 4×5</button></div>
<div class="board" id="board"></div>
<button class="btn l" id="btnReset" type="button">はじめから</button>

<div class="ov" id="ovEnd" hidden>
  <p class="eb">CLEAR!</p>
  <div class="stars" id="stars">★★★</div>
  <div class="big" id="endTime">12.3秒</div>
  <h1 id="endTitle">そろった！</h1>
  <div class="card" id="endCard"></div>
  <button class="btn" id="btnAgain" type="button">もう一度</button>
  <button class="btn l" id="btnNext" type="button">つぎの難しさへ</button>
  <button class="btn l" id="btnShare" type="button">結果をシェア</button>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const ITEMS = ['🍼', '🧸', '🧦', '👶', '🎀', '🧢', '🍓', '🎂', '🎈', '🐤', '🌙', '⭐', '🧷', '🛁', '🪁', '🦄'];
const LEVELS = [{ c: 3, r: 4, par: 10 }, { c: 4, r: 4, par: 16 }, { c: 4, r: 5, par: 24 }];
const KEY = 'gr-memory';
let rec = { best: [null, null, null], plays: 0 }; try { Object.assign(rec, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} };
let AC = null; const audioInit = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); };
const tone = (f, t = 0.1, type = 'triangle', g = 0.12, when = 0) => { if (!AC) return; const o = AC.createOscillator(), v = AC.createGain(); o.type = type; o.frequency.value = f; v.gain.setValueAtTime(g, AC.currentTime + when); v.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + t); o.connect(v).connect(AC.destination); o.start(AC.currentTime + when); o.stop(AC.currentTime + when + t + 0.02); };
let L = 0, cards = [], open = [], lock = false, moves = 0, pairs = 0, t0 = 0, timer = 0, started = false;
const board = $('#board');
function build() {
  const lv = LEVELS[L]; const n = lv.c * lv.r / 2;
  const pool = ITEMS.slice().sort(() => Math.random() - 0.5).slice(0, n); const deck = pool.concat(pool).sort(() => Math.random() - 0.5);
  board.style.gridTemplateColumns = `repeat(${lv.c}, 1fr)`; board.innerHTML = ''; cards = []; open = []; lock = false; moves = 0; pairs = 0; started = false; clearInterval(timer);
  deck.forEach((e, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'cardb'; b.dataset.e = e; b.innerHTML = '<div class="in"><div class="b"></div><div class="f">' + e + '</div></div>'; b.addEventListener('click', () => flip(b)); board.appendChild(b); cards.push(b); });
  $('#hTime').textContent = '⏱ 0.0'; $('#hMoves').textContent = '🔁 0回'; $('#hPairs').textContent = `✓ 0/${n}`; $('#ovEnd').hidden = true;
}
function flip(b) {
  if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
  audioInit(); if (!started) { started = true; t0 = performance.now(); timer = setInterval(() => { $('#hTime').textContent = '⏱ ' + ((performance.now() - t0) / 1000).toFixed(1); }, 100); }
  b.classList.add('open'); open.push(b); tone(660, 0.06);
  if (open.length === 2) {
    moves += 1; $('#hMoves').textContent = `🔁 ${moves}回`; lock = true;
    const [a, c] = open;
    if (a.dataset.e === c.dataset.e) { setTimeout(() => { a.classList.add('done'); c.classList.add('done'); a.classList.remove('open'); c.classList.remove('open'); open = []; lock = false; pairs += 1; $('#hPairs').textContent = `✓ ${pairs}/${cards.length / 2}`; tone(988, 0.1); tone(1318, 0.15, 'triangle', 0.1, 0.08); if (pairs === cards.length / 2) finish(); }, 350); }
    else { setTimeout(() => { a.classList.remove('open'); c.classList.remove('open'); open = []; lock = false; tone(330, 0.1, 'sawtooth', 0.05); }, 800); }
  }
}
function finish() {
  clearInterval(timer); const sec = (performance.now() - t0) / 1000; const lv = LEVELS[L];
  const stars = moves <= lv.par ? 3 : moves <= lv.par * 1.5 ? 2 : 1;
  rec.plays += 1; const prev = rec.best[L]; const isBest = !prev || sec < prev.sec; if (isBest) rec.best[L] = { sec: Math.round(sec * 10) / 10, moves }; save();
  $('#stars').innerHTML = '★★★'.split('').map((c, i) => i < stars ? `<b>${c}</b>` : c).join('');
  $('#endTime').textContent = sec.toFixed(1) + '秒'; $('#endTitle').textContent = stars === 3 ? 'すごい記憶力！' : stars === 2 ? 'いい感じ！' : 'そろった！';
  $('#endCard').innerHTML = `<div class="r"><span>めくった回数</span><em>${moves}回（目安 ${lv.par}回）</em></div><div class="r"><span>自己ベスト${isBest ? '　🎉 更新！' : ''}</span><em>${rec.best[L].sec}秒 / ${rec.best[L].moves}回</em></div>`;
  $('#btnNext').hidden = L >= 2; $('#ovEnd').hidden = false; [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.12, i * 0.1));
}
document.querySelectorAll('#levels button').forEach((b) => b.addEventListener('click', () => { L = +b.dataset.l; document.querySelectorAll('#levels button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); build(); }));
$('#btnReset').addEventListener('click', build); $('#btnAgain').addEventListener('click', build);
$('#btnNext').addEventListener('click', () => { L = Math.min(2, L + 1); document.querySelectorAll('#levels button').forEach((x) => x.setAttribute('aria-pressed', String(+x.dataset.l === L))); build(); });
$('#btnShare').addEventListener('click', async () => {
  const text = `ベビーグッズ神経衰弱（${['やさしい', 'ふつう', 'むずかしい'][L]}）を ${$('#endTime').textContent}・${moves}回でクリア！ きみもやってみて 🍼🧸`; const url = 'https://webkuuta.com/play/memory/';
  if (navigator.share) { try { await navigator.share({ text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text + ' ' + url); } catch (e) {}
});
build();
})();
</script>
</body>
</html>
