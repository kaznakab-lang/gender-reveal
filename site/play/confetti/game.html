<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>紙吹雪キャッチ｜ジェンダーリビール ゲーム</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://webkuuta.com/play/confetti/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--cocoa:#6b4f5a;--soft:#8c727c;--pink:#f6a9c6;--pink-deep:#e57fa6;--blue:#9ccdf3;--blue-deep:#5a9fd8;--gold:#ffd66b;--f-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--f-latin:"Fredoka","Zen Maru Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(180deg,#fffaf6,#fdf2f4 60%,#f3eef8);color:var(--cocoa);font-family:var(--f-round);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;padding:0 12px;pointer-events:none;z-index:2}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:900;box-shadow:0 3px 10px rgba(107,79,90,.1);white-space:nowrap}
.pill.t{font-family:var(--f-latin);font-weight:700;min-width:54px;text-align:center}
.pill.t.low{background:#ffe3e3;color:#c0392b}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;background:rgba(255,250,246,.9);z-index:3}
.ov[hidden]{display:none}
.eb{margin:0;font-family:var(--f-latin);font-weight:600;font-size:11px;letter-spacing:.3em;color:#b98f3f}
h1{margin:0;font-weight:900;font-size:28px;line-height:1.3}
p{margin:0;font-size:13px;color:var(--soft);line-height:1.7}
.btn{border:0;border-radius:999px;padding:14px 36px;font:inherit;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(100deg,var(--pink-deep),#f1a2bf 50%,var(--blue-deep));box-shadow:0 10px 24px rgba(214,160,190,.4);margin-top:8px}
.btn.l{background:#fff;color:var(--cocoa);box-shadow:0 6px 16px rgba(180,140,170,.18);font-size:14px;padding:11px 22px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;text-align:left;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(180,140,170,.14)}
.legend b{font-size:18px;margin-right:4px}
.big{font-family:var(--f-latin);font-weight:700;font-size:56px;line-height:1;color:var(--pink-deep);text-shadow:0 4px 0 #fff}
.card{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 6px 18px rgba(180,140,170,.14);font-size:13px;text-align:left;min-width:240px}
.card .r{display:flex;justify-content:space-between;gap:12px}
.card .r em{font-style:normal;font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--cocoa);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .25s;z-index:4;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span class="pill" id="hScore">⭐ 0</span><span class="pill" id="hCombo"></span><span class="pill" id="hLives">❤️❤️❤️</span><span class="pill t" id="hTime">45</span></div>

<div class="ov" id="ovStart">
  <p class="eb">GENDER REVEAL MINI GAME</p>
  <h1>紙吹雪キャッチ</h1>
  <p>発表のあとに舞う紙吹雪を、ゆりかごで受け止めよう。<br>指（マウス）で左右に動かします。45秒でどれだけ集められる？</p>
  <div class="legend">
    <div><b>🎀</b>ピンクの紙吹雪 +10</div><div><b>🧢</b>ブルーの紙吹雪 +10</div>
    <div><b>🍼</b>哺乳びん +50</div><div><b>🧸</b>くまさん +100</div>
    <div><b>⭐</b>おほしさま 5秒のびる</div><div><b>💨</b>けむり玉 ❤️ −1</div>
  </div>
  <p>同じ色を続けて取るとコンボ。10コンボで点数2倍！</p>
  <p id="bestLine"></p>
  <button class="btn" id="btnStart" type="button">はじめる</button>
</div>

<div class="ov" id="ovEnd" hidden>
  <p class="eb">RESULT</p>
  <div class="big" id="endScore">0</div>
  <h1 id="endTitle">おつかれさま！</h1>
  <div class="card" id="endCard"></div>
  <button class="btn" id="btnAgain" type="button">もう一度</button>
  <button class="btn l" id="btnShare" type="button">結果をシェア</button>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const resize = () => { DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); };
window.addEventListener('resize', resize); resize();
const KEY = 'gr-confetti';
let rec = { best: 0, games: 0 }; try { Object.assign(rec, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} };
$('#bestLine').textContent = rec.games ? `自己ベスト ${rec.best.toLocaleString()}点（${rec.games}回プレイ）` : '';
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1200); };

/* 音（合成） */
let AC = null; const audioInit = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); };
const tone = (f, t = 0.1, type = 'triangle', g = 0.12, when = 0) => { if (!AC) return; const o = AC.createOscillator(), v = AC.createGain(); o.type = type; o.frequency.value = f; v.gain.setValueAtTime(g, AC.currentTime + when); v.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + t); o.connect(v).connect(AC.destination); o.start(AC.currentTime + when); o.stop(AC.currentTime + when + t + 0.02); };

/* ゲームの状態 */
const KINDS = [
  { k: 'pink', e: '🎀', pts: 10, w: 34 }, { k: 'blue', e: '🧢', pts: 10, w: 34 },
  { k: 'bottle', e: '🍼', pts: 50, w: 6 }, { k: 'bear', e: '🧸', pts: 100, w: 2.5 },
  { k: 'star', e: '⭐', pts: 0, w: 2 }, { k: 'smoke', e: '💨', pts: 0, w: 9 },
];
let S = null, raf = 0, last = 0, px = 0.5, pointerOn = false;
const newState = () => ({ t: 45, score: 0, lives: 3, combo: 0, comboColor: null, maxCombo: 0, items: [], parts: [], spawn: 0, elapsed: 0, caught: { pink: 0, blue: 0, bottle: 0, bear: 0, star: 0 }, over: false, mult: 1 });
const pickKind = () => { const sum = KINDS.reduce((a, k) => a + k.w, 0); let r = Math.random() * sum; for (const k of KINDS) { r -= k.w; if (r <= 0) return k; } return KINDS[0]; };
const basket = () => ({ x: px * (W - 90) + 45, y: H - 70 - 20, w: 90, h: 28 });

function spawn() {
  const k = pickKind(); const sz = k.k === 'pink' || k.k === 'blue' ? 20 : 30;
  const speed = (90 + S.elapsed * 3.2 + Math.random() * 60) * (k.k === 'smoke' ? 1.15 : 1);
  S.items.push({ k, x: 20 + Math.random() * (W - 40), y: -30, vy: speed, vx: (Math.random() - 0.5) * 40, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 4, sz });
}
function burst(x, y, col, n = 10) { for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: (Math.random() - 0.5) * 240, vy: -Math.random() * 200 - 40, life: 0.7, col }); }
function catchItem(it) {
  const k = it.k.k;
  if (k === 'smoke') { S.lives -= 1; S.combo = 0; S.comboColor = null; S.mult = 1; burst(it.x, it.y, '#777', 14); tone(180, 0.25, 'sawtooth', 0.1); toast('けむり玉！ ❤️ −1'); if (S.lives <= 0) end(); return; }
  if (k === 'star') { S.t += 5; S.caught.star += 1; burst(it.x, it.y, '#ffd66b', 14); tone(1318, 0.15); tone(1760, 0.25, 'triangle', 0.1, 0.1); toast('+5秒！'); return; }
  let pts = it.k.pts;
  if (k === 'pink' || k === 'blue') {
    if (S.comboColor === k) S.combo += 1; else { S.combo = 1; S.comboColor = k; }
    S.maxCombo = Math.max(S.maxCombo, S.combo);
    if (S.combo === 10) { S.mult = 2; toast('10コンボ！ 点数2倍！'); tone(880, 0.1); tone(1100, 0.1, 'triangle', 0.12, 0.08); tone(1320, 0.2, 'triangle', 0.12, 0.16); }
    pts = pts * S.mult + Math.min(S.combo, 9) * 2;
    tone(k === 'pink' ? 740 : 620, 0.06, 'triangle', 0.08);
  } else { tone(988, 0.12); tone(1318, 0.18, 'triangle', 0.1, 0.08); }
  S.caught[k] = (S.caught[k] || 0) + 1; S.score += pts;
  burst(it.x, it.y, k === 'pink' ? '#f6a9c6' : k === 'blue' ? '#9ccdf3' : '#ffd66b');
  S.parts.push({ x: it.x, y: it.y - 10, vx: 0, vy: -60, life: 0.8, txt: '+' + pts });
}
function step(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (!S.over) {
    S.t -= dt; S.elapsed += dt; S.spawn -= dt;
    if (S.spawn <= 0) { spawn(); S.spawn = Math.max(0.22, 0.75 - S.elapsed * 0.012); }
    const b = basket();
    S.items.forEach((it) => { it.y += it.vy * dt; it.x += it.vx * dt; it.rot += it.vr * dt; if (it.x < 14) it.vx = Math.abs(it.vx); if (it.x > W - 14) it.vx = -Math.abs(it.vx); });
    S.items = S.items.filter((it) => {
      if (it.y > b.y - 6 && it.y < b.y + b.h + 10 && Math.abs(it.x - b.x) < b.w / 2 + it.sz * 0.3) { catchItem(it); return false; }
      if (it.y > H + 40) { if ((it.k.k === 'pink' || it.k.k === 'blue') && S.combo > 0 && S.comboColor === it.k.k) { /* 取りこぼしはコンボ切れ */ S.combo = 0; S.comboColor = null; S.mult = 1; } return false; }
      return true;
    });
    S.parts.forEach((p) => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }); S.parts = S.parts.filter((p) => p.life > 0);
    if (S.t <= 0) { S.t = 0; end(); }
  }
  draw();
  $('#hScore').textContent = '⭐ ' + S.score.toLocaleString(); $('#hLives').textContent = '❤️'.repeat(Math.max(0, S.lives)) + '🖤'.repeat(3 - Math.max(0, S.lives));
  $('#hCombo').textContent = S.combo >= 2 ? `🔥 ${S.combo}コンボ${S.mult > 1 ? ' ×2' : ''}` : ''; const ht = $('#hTime'); ht.textContent = Math.ceil(S.t); ht.classList.toggle('low', S.t <= 10);
  if (!S.over) raf = requestAnimationFrame(step);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  // 床
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(0, H - 40, W, 40);
  // ゆりかご
  const b = basket(); ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#e8d3dc'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-b.w / 2, 0); ctx.quadraticCurveTo(0, b.h * 2.2, b.w / 2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f6a9c6'; ctx.fillRect(-b.w / 2, -4, b.w, 8); ctx.fillStyle = '#9ccdf3'; ctx.fillRect(-b.w / 2, -4, b.w / 2, 8);
  ctx.strokeStyle = '#c9a27a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-b.w / 2 + 6, b.h * 1.3); ctx.quadraticCurveTo(0, b.h * 1.9, b.w / 2 - 6, b.h * 1.3); ctx.stroke();
  ctx.restore();
  // 落ちてくるもの
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  S.items.forEach((it) => { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.k.k === 'pink' || it.k.k === 'blue' ? it.rot : Math.sin(it.rot) * 0.2); ctx.font = `${it.sz}px serif`; ctx.fillText(it.k.e, 0, 0); ctx.restore(); });
  // 粒と点数
  S.parts.forEach((p) => { ctx.globalAlpha = Math.max(0, p.life / 0.8); if (p.txt) { ctx.fillStyle = '#6b4f5a'; ctx.font = '900 16px "Zen Maru Gothic", sans-serif'; ctx.fillText(p.txt, p.x, p.y); } else { ctx.fillStyle = p.col; ctx.fillRect(p.x - 3, p.y - 4, 6, 8); } ctx.globalAlpha = 1; });
}
function start() { audioInit(); S = newState(); px = 0.5; $('#ovStart').hidden = true; $('#ovEnd').hidden = true; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(step); tone(880, 0.08); }
function end() {
  if (S.over) return; S.over = true; cancelAnimationFrame(raf); draw();
  rec.games += 1; const best = S.score > rec.best; if (best) rec.best = S.score; save();
  $('#endScore').textContent = S.score.toLocaleString();
  $('#endTitle').textContent = S.lives <= 0 ? 'けむりだらけ…' : S.score >= 1500 ? 'キャッチの達人！' : S.score >= 800 ? 'なかなかの腕前！' : 'おつかれさま！';
  $('#endCard').innerHTML = `<div class="r"><span>🎀 ピンク</span><em>${S.caught.pink}こ</em></div><div class="r"><span>🧢 ブルー</span><em>${S.caught.blue}こ</em></div><div class="r"><span>🍼 哺乳びん</span><em>${S.caught.bottle}こ</em></div><div class="r"><span>🧸 くまさん</span><em>${S.caught.bear}こ</em></div><div class="r"><span>🔥 最大コンボ</span><em>${S.maxCombo}</em></div><div class="r"><span>自己ベスト${best ? '　🎉 更新！' : ''}</span><em>${rec.best.toLocaleString()}</em></div>`;
  $('#ovEnd').hidden = false; S.lives <= 0 ? (tone(330, 0.2, 'sawtooth', 0.08), tone(262, 0.3, 'sawtooth', 0.08, 0.18)) : ([523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.12, i * 0.1)));
}
const move = (e) => { px = Math.max(0, Math.min(1, (e.clientX - 45) / (W - 90))); };
window.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; pointerOn = true; move(e); });
window.addEventListener('pointermove', (e) => { if (pointerOn || e.pointerType === 'mouse') move(e); });
window.addEventListener('pointerup', () => { pointerOn = false; });
window.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') px = Math.max(0, px - 0.06); if (e.key === 'ArrowRight') px = Math.min(1, px + 0.06); });
$('#btnStart').addEventListener('click', start); $('#btnAgain').addEventListener('click', start);
$('#btnShare').addEventListener('click', async () => {
  const text = `紙吹雪キャッチで ${S.score.toLocaleString()}点！（最大${S.maxCombo}コンボ）きみもゆりかごで受け止めてみて 🎀🧢`; const url = 'https://webkuuta.com/play/confetti/';
  if (navigator.share) { try { await navigator.share({ text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text + ' ' + url); toast('コピーしました'); } catch (e) { toast(text); }
});
S = newState(); draw();
})();
</script>
</body>
</html>
