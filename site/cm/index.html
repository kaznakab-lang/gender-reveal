<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ff1f2d">
<title>CM｜ジェンダーリビール ケーキ</title>
<!-- AdSense：このページを開くと、AdSense の「オファーウォール」（CM）が出ます -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3569112084446052" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* CMのあいだの画面。ここだけは、わざとテレビのCM前みたいに派手にしています */
:root{--yellow:#ffe600;--red:#ff1f2d;--ink:#111;--f-telop:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;--f-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--red);overscroll-behavior:none}
body{overflow:hidden;font-family:var(--f-round);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);text-align:center;overflow:hidden}
.burst{position:absolute;inset:-10%;background:radial-gradient(circle at 50% 42%,#fff 0%,var(--yellow) 16%,#ff9d00 40%,var(--red) 68%,#a000c8 100%);animation:hue 2.4s linear infinite}
.rays{position:absolute;left:50%;top:42%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.8) 0deg 3deg,rgba(255,255,255,0) 3deg 10deg);-webkit-mask-image:radial-gradient(circle,transparent 7%,#000 20%);mask-image:radial-gradient(circle,transparent 7%,#000 20%);animation:spin 9s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.box{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:-8vh}
.small{margin:0;font-family:var(--f-telop);font-size:clamp(22px,7vw,38px);color:#fff;background:var(--red);padding:.08em .5em .14em;transform:skewX(-10deg) rotate(-3deg);box-shadow:6px 6px 0 var(--ink);border:3px solid #fff;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.big{margin:0;font-family:var(--f-telop);font-size:clamp(64px,22vw,150px);line-height:1;color:transparent;background:linear-gradient(180deg,#ff2a55 0%,#ff8a00 22%,#ffe600 42%,#2fd400 60%,#00b3ff 78%,#8a00ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:3px #fff;filter:drop-shadow(5px 5px 0 var(--ink));animation:slam .5s .15s cubic-bezier(.2,1.5,.35,1) both}
.sub{margin:6px 0 0;font-weight:900;font-size:clamp(17px,5vw,22px);color:var(--ink);background:var(--yellow);padding:6px 16px;border:3px solid var(--ink);border-radius:999px;animation:pop .35s .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{opacity:0;transform:skewX(-10deg) rotate(-3deg) scale(.3)}100%{opacity:1}}
@keyframes slam{0%{opacity:0;transform:scale(3) rotate(-12deg)}55%{opacity:1;transform:scale(.9) rotate(3deg)}100%{opacity:1;transform:none}}
.wait{position:relative;margin:4px 0 0;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.go{position:absolute;left:16px;right:16px;bottom:calc(max(26px,5vh) + env(safe-area-inset-bottom,0px));margin:auto;width:fit-content;display:inline-flex;align-items:center;gap:12px;border:3px solid #fff;border-radius:999px;padding:14px 30px 14px 26px;background:var(--red);color:#fff;font-family:var(--f-round);font-weight:900;font-size:18px;letter-spacing:.04em;box-shadow:0 6px 0 #7d0f14,0 10px 24px rgba(0,0,0,.35);cursor:pointer;animation:up .45s ease-out both,nudge 1.6s 1s ease-in-out infinite}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #7d0f14}
.go .play{flex:none;width:0;height:0;border-left:15px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.go small{display:block;font-size:12px;font-weight:700;opacity:.92}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{scale:1}50%{scale:1.05}}
@media (prefers-reduced-motion:reduce){.burst,.rays,.go{animation:none}}
</style>
</head>
<body>
<main>
  <div class="burst" aria-hidden="true"></div>
  <div class="rays" aria-hidden="true"></div>
  <div class="box">
    <p class="small">ただいま</p>
    <p class="big">CM中</p>
    <p class="sub">このあと すぐ発表！</p>
    <p id="wait" class="wait">CMが流れたら、最後までご覧ください</p>
  </div>
  <button id="go" class="go" type="button" hidden><span class="play" aria-hidden="true"></span><span>続きを見る<small>いよいよ結果発表！</small></span></button>
</main>
<script>
/* CMのあと、ケーキの画面（/r/）に戻る。
   「続きを見る」を押したときだけ、同じタブの中に「CMを見た」印を残す。ケーキの画面はその印を見て続きから始める。 */
(function () {
  var hash = location.hash || '';
  var body = hash.slice(1).split('.')[0];
  if (body.length < 8) { location.replace('/'); return; }
  var btn = document.getElementById('go');
  var shownAt = Date.now() + 5000;   // CMが読み込まれる前に押されないよう、少し待つ

  // CM（オファーウォール）が画面に出ているあいだは、ボタンを出さない
  function adOnScreen() {
    var els = document.querySelectorAll('.fc-message-root, .fc-dialog-overlay, .fc-ab-root');
    for (var i = 0; i < els.length; i++) {
      var r = els[i].getBoundingClientRect();
      if (r.width > 0 && r.height > 0 && getComputedStyle(els[i]).display !== 'none') return true;
    }
    return false;
  }
  var timer = setInterval(function () {
    var ready = Date.now() >= shownAt && !adOnScreen();
    btn.hidden = !ready;
    document.getElementById('wait').hidden = ready;
  }, 400);

  btn.addEventListener('click', function () {
    clearInterval(timer);
    try { sessionStorage.setItem('gr-cm-done', JSON.stringify({ body: body, t: Date.now() })); } catch (e) { /* 保存できなくても進む */ }
    location.replace('/r/' + location.search + hash);
  });
})();
</script>
</body>
</html>
